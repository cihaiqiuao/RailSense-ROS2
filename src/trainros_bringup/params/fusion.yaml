# 融合和平稳性评估参数。
trainros_fusion:
  ros__parameters:
    output_rate_hz: 50.0
    frame_id: base_link
    sync_queue_size: 20
    sync_slop_ms: 50
    diagnostics_period_ms: 1000
    gps_timeout_ms: 1000
    coupler_timeout_ms: 1000
    sensor_timeout_ms: 500

trainros_stability_evaluator:
  ros__parameters:
    warning_threshold: 70.0
    alarm_threshold: 40.0
    window_size: 250
    rms_alarm_acceleration: 3.0
