# 融合和平稳性评估参数。
trainros_fusion:
  ros__parameters:
    output_rate_hz: 50.0
    frame_id: base_link
    sync_queue_size: 20
    sync_slop_ms: 50
    diagnostics_period_ms: 1000
    gps_timeout_ms: 1000
    coupler_timeout_ms: 1000
    sensor_timeout_ms: 500

    # 三维 Kalman 融合：状态量为 position、speed 和 acceleration。
    # Laser 提供距离/位置观测，GPS 提供低频速度校正，IMU 提供高频加速度观测。
    enable_kalman_filter: true
    process_noise_position: 0.1
    process_noise_speed: 0.2
    process_noise_acceleration: 1.0
    laser_distance_measurement_noise: 0.05
    gps_speed_measurement_noise: 0.5
    imu_acceleration_measurement_noise: 0.2

trainros_stability_evaluator:
  ros__parameters:
    warning_threshold: 70.0
    alarm_threshold: 40.0
    window_size: 250
    rms_alarm_acceleration: 3.0
